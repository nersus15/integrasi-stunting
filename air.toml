[build]
cmd = "go build -o ./tmp/main ./app/main.go"
entrypoint = ["./tmp/main", "stunting"]
exclude_dir = ["go", "tmp", "tests", "vendor", "testdata"]
# docs di-embed ke biner, jadi perubahannya juga harus memicu build
include_ext = ["go", "tpl", "tmpl", "html", "md", "css", "js"]
poll = true
poll_interval = 500

[log]
# Show log time
time = false
# Only show main log (silences watcher, build, runner)
main_only = false
# silence all logs produced by air
silent = false

[color]
# Customize each part's color. If no color found, use the raw app log.
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"